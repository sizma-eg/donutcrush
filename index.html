/* =========================

========================= */

let products = [];

);

function money(n){
  return `${Number(n || 0).toLocaleString("en-EG")} EGP`;
}

function save(){
  localStorage.setItem(
    "donutCrushCart",
    JSON.stringify(cart)
  );

  renderCart();
  updateCount();
}

function toast(msg){
  const t = $("#toast");

  t.textContent = msg;
  t.classList.add("show");

  clearTimeout(window.tt);

  window.tt = setTimeout(
    () => t.classList.remove("show"),
    2200
  );
}


/* =========================
   CATEGORY NORMALIZER

   Dashboard categories:
   شيكولاتة
   لوتس
   فراولة
   كلاسيك
   كيندر
   كراميل
   اوريو
   مخصوص
========================= */

function normalizeCategory(value){

  const v = String(value || "")
    .trim()
    .toLowerCase();

  const map = {

    "chocolate": "شيكولاتة",
    "شوكولاتة": "شيكولاتة",
    "شيكولاته": "شيكولاتة",
    "شيكولاتة": "شيكولاتة",

    "lotus": "لوتس",
    "لوتس": "لوتس",

    "strawberry": "فراولة",
    "strawberries": "فراولة",
    "فراولة": "فراولة",

    "classic": "كلاسيك",
    "كلاسيك": "كلاسيك",

    "kinder": "كيندر",
    "كيندر": "كيندر",

    "caramel": "كراميل",
    "كراميل": "كراميل",

    "oreo": "اوريو",
    "أوريو": "اوريو",
    "اوريو": "اوريو",

    "special": "مخصوص",
    "مخصوص": "مخصوص"

  };

  return map[v] || String(value || "").trim();
}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  try{

    const {
      data,
      error
    } = await db
      .from("Products")
      .select("*")
      .order("created_at", {
        ascending: true
      });

    if(error){

      console.error(
        "Supabase Products error:",
        error
      );

      toast("حصل خطأ في تحميل المنتجات");

      products = [];

      renderProducts();

      return;
    }

    products = (data || [])

      .filter(
        p => p.available !== false
      )

      .map(p => ({

        id: p.id,

        name:
          p.name ||
          "",

        cat:
          normalizeCategory(
            p.category ||
            p.cat ||
            "مخصوص"
          ),

        price:
          Number(p.price) || 0,

        img:
          p.image ||
          p.img ||
          "donuts-1.jpg",

        desc:
          p.description ||
          p.desc ||
          ""

      }));

    console.log(
      "Products loaded from Supabase:",
      products
    );

    renderProducts();

    renderCart();

    updateCount();

  }catch(error){

    console.error(
      "Products loading error:",
      error
    );

    products = [];

    toast("تعذر الاتصال بقاعدة البيانات");

    renderProducts();
  }
}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(list = products){

  if(!list.length){

        text-align:center;
        padding:40px;
        color:var(--muted)

        ملقيناش الدونات دي 🍩

    return;
  }

  box.innerHTML = list.map(p => `

    <article class="card">

      <div class="card-img">

        <img
          src="${p.img}"
          alt="${p.name}"
        >

        <button
          class="fav"
          onclick="toast('المفضلة هتتربط بحسابك بعدين ❤️')"
        >
          ♡
        </button>

      </div>

      <div class="card-body">

        <div class="card-title">
          ${p.name}
        </div>

        <div class="card-desc">
          ${p.desc}
        </div>

        <div class="card-bottom">

          <span class="price">
            ${money(p.price)}
          </span>

          <button
            class="add"
            onclick="addToCart('${p.id}')"
          >
            + ضيف
          </button>

        </div>

    </article>

  `).join("");
}


/* =========================
   CART
========================= */

function addToCart(id){

  const p = products.find(
    x => String(x.id) === String(id)
  );

  if(!p) return;

  const item = cart.find(
    x => String(x.id) === String(id)
  );

  if(item){

    item.qty++;

  }else{

    cart.push({
      id: p.id,
      qty: 1
    });

  }

  save();

  toast(
    `${p.name} اتضافت للسلة 🍩`
  );
}


function updateCount(){

  $("#cartCount").textContent =
    cart.reduce(
      (a,x) => a + x.qty,
      0
    );
}


function renderCart(){

  const box = $("#cartItems");

  if(!cart.length){

    box.innerHTML = `
      <div class="empty">

        <div class="donut">
          🍩
        </div>

        <b>
          السلة فاضية
        </b>

        <p style="margin-top:7px">
          اختارلك دونات وخلي يومك أحلى.
        </p>

      </div>
    `;

    $("#cartالإجمالي").textContent =
      "0 EGP";

    return;
  }

  let total = 0;

  box.innerHTML = cart.map(item => {

    const p = products.find(
      x => String(x.id) === String(item.id)
    );

    if(!p) return "";

    const sub =
      p.price * item.qty;

    total += sub;

    return `

      <div class="cart-item">

        <img
          src="${p.img}"
          alt="${p.name}"
        >

        <div>

          <h4>
            ${p.name}
          </h4>

          <small>
            ${money(p.price)}
          </small>

          <div class="qty">

            <button
              onclick="changeQty('${p.id}',-1)"
            >
              −
            </button>

            <b>
              ${item.qty}
            </b>

            <button
              onclick="changeQty('${p.id}',1)"
            >
              +
            </button>

          </div>

          <button
            class="remove"
            onclick="removeItem('${p.id}')"
          >
            شيلها
          </button>

        </div>

        <b>
          ${money(sub)}
        </b>

      </div>

    `;

  }).join("");

  $("#cartالإجمالي").textContent =
    money(total);
}


function changeQty(id,delta){

  const x = cart.find(
    i => String(i.id) === String(id)
  );

  if(!x) return;

  x.qty += delta;

  if(x.qty <= 0){

    cart = cart.filter(
      i => String(i.id) !== String(id)
    );

  }

  save();
}


function removeItem(id){

  cart = cart.filter(
    i => String(i.id) !== String(id)
  );

  save();

  toast("اتشالت من السلة 🗑️");
}


/* =========================
   CHECKOUT
========================= */

function renderCheckout(){

  let total = 0;

  const rows = cart.map((x,i) => {

    const p = products.find(
      p => String(p.id) === String(x.id)
    );

    if(!p) return "";

    const sub =
      p.price * x.qty;

    total += sub;

    return `
      <div>
        ${i+1}. ${p.name}
        × ${x.qty}
        — ${money(sub)}
      </div>
    `;

  }).join("");

  $("#checkoutSummary").innerHTML =
    rows +
    `
      <div class="sum-total">
        الإجمالي: ${money(total)}
      </div>
    `;
}

/* =========================
   INSTAGRAM ORDER
========================= */

function buildInstagramOrder(){

  let total = 0;

  const rows = cart.map((x,i) => {

    const p = products.find(
      p => String(p.id) === String(x.id)
    );

    if(!p) return "";

    const sub =
      p.price * x.qty;

    total += sub;

    return `
${i+1}. ${p.name} × ${x.qty} — ${money(sub)}
`;

  }).join("");

  return `🍩 طلب جديد — Donut Crush

🛍️ الطلب:
${rows}

💰 الإجمالي: ${money(total)}
💵 الدفع: عند الاستلام

👤 بيانات العميل:
الاسم: ${$("#customerName").value.trim()}
الموبايل: ${$("#customerPhone").value.trim()}
المحافظة: ${$("#customerGovernorate").value.trim()}
المنطقة: ${$("#customerArea").value.trim()}
العنوان بالتفصيل: ${$("#customerAddress").value.trim()}
ملاحظات: ${$("#customerNotes").value.trim() || "لا يوجد"}

— تم الطلب من موقع Donut Crush`;

}


/* =========================

$("#closeCheckout").onclick = () =>

};


$("#checkoutForm").onsubmit = async e => {

  e.preventDefault();

  const name =
    $("#customerName").value.trim();

  const phone =
    $("#customerPhone").value.trim();

  const gov =
    $("#customerGovernorate").value.trim();

  const area =
    $("#customerArea").value.trim();

  const address =
    $("#customerAddress").value.trim();

  const notes =
    $("#customerNotes").value.trim();


  if(!/^[ء-يٰـ\s]+$/.test(name)){

    toast(
      "الاسم لازم يكون حروف عربي فقط"
    );

    return;
  }


  if(!/^01[0-9]{9}$/.test(phone)){

    toast(
      "رقم الموبايل لازم 11 رقم ويبدأ بـ 01"
    );

    return;
  }


  if(!gov){

    toast("اختار المحافظة");

    return;
  }


  if(!area){

    toast("اختار المنطقة");

    return;
  }


  if(!address){

    toast("اكتب العنوان بالتفصيل");

    return;
  }


  if(!cart.length){

    toast("السلة فاضية");

    return;
  }


  /* =========================
     SAVE ORDER TO SUPABASE
  ========================= */

  let total = 0;

  const items = cart.map(x => {

    const p = products.find(
      p => String(p.id) === String(x.id)
    );

    if(!p) return null;

    const subtotal =
      p.price * x.qty;

    total += subtotal;

    return {

      id: p.id,

      name: p.name,

      price: p.price,

      quantity: x.qty,

      subtotal: subtotal

    };

  }).filter(Boolean);


  const orderData = {

    customer_name: name,

    customer_phone: phone,

    governorate: gov,

    area: area,

    address: address,

    notes: notes || null,

    items: items,

    total: total,

    payment_method: "عند الاستلام",

    status: "جديد"

  };


  try{

    const {
      data,
      error
    } = await db
      .from("orders")
      .insert([orderData])
      .select();


    if(error){

      console.error(
        "Supabase order error:",
        error
      );

      toast(
        "حصل خطأ في حفظ الأوردر"
      );

      return;
    }


    console.log(
      "Order saved:",
      data
    );


    /* =========================
       COPY INSTAGRAM MESSAGE
    ========================= */

    const order =
      buildInstagramOrder();


    try{

      await navigator.clipboard.writeText(
        order
      );

    }catch(_){

      const t =
        document.createElement("textarea");

      t.value = order;

      document.body.appendChild(t);

      t.select();

      document.execCommand("copy");

      t.remove();

    }


    $("#checkoutModal")
      .classList
      .remove("show");


    localStorage.removeItem(
      "donutCrushCart"
    );

    cart = [];

    renderCart();

    updateCount();


    toast(
      "الأوردر اتسجل واتنسخ كامل 📋"
    );


    setTimeout(() => {

      window.open(
        "https://www.instagram.com/guss292026_/",
        "_blank",
        "noopener,noreferrer"
      );

    },500);


  }catch(error){

    console.error(
      "Order exception:",
      error
    );

    toast(
      "حصل خطأ في حفظ الأوردر"
    );

  }

};


/* =========================
   CATEGORIES
========================= */

function filter(cat){

  activeCat = cat;

  document
    .querySelectorAll(".cat")
    .forEach(b => {

      b.classList.toggle(
        "active",
        b.dataset.cat === cat
      );

    });


  renderProducts(

    cat === "all"

      ? products

      : products.filter(
          p => normalizeCategory(p.cat) === cat
        )

  );

}


$("#categories").addEventListener(
  "click",
  e => {

    const b =
      e.target.closest(".cat");

    if(b){

      filter(
        b.dataset.cat
      );

    }

  }
);

const observer =
  new IntersectionObserver(
    es =>
      es.forEach(e => {

        if(e.isIntersecting){

          e.target.classList.add(
            "visible"
          );

        }

      }),
    {
      threshold:.08
    }
  );


document
  .querySelectorAll(".reveal")
  .forEach(
    el => observer.observe(el)
  );
